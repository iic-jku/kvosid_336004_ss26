# SPDX-License-Identifier: Apache-2.0 WITH SHL-2.1
#
# CACE characterization of the inverter LNA over process, supply and
# temperature. ngspice small signal only: supply current, S11,
# transconductance and noise figure. P1dB and IIP3 need harmonic balance and
# stay in the VACASK benches. The size conditions between the <sizes> markers
# are written by scripts/lna_inv_sizing.py --write, the same numbers the
# VACASK benches use.
#
# One parameter set. The pair self-biases at its own trip point through RF,
# so there is no bias node to drive and no second bias variant to compare.

name:           lna_inv
description:    Coil-free resistive-feedback inverter LNTA
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Michael Koefinger
  company:          Johannes Kepler University
  creation_date:    September 11, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDD:
    description: 1.2 V analog supply, the chip's single rail
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.32
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  vin:
    description: RF input from the 50 ohm antenna
    type: signal
    direction: input
  vout:
    description: RF current output into the passive mixer
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog supply voltage
    display: VDD
    unit: V
    typical: 1.2
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  # <sizes> written by scripts/lna_inv_sizing.py --write, do not edit
  WN:
    description: LNA size from lna_inv_sizing.py
    display: WN
    unit: m
    typical: 0.0001554
  LNCH:
    description: LNA size from lna_inv_sizing.py
    display: LNCH
    unit: m
    typical: 1.3e-07
  NGN:
    description: LNA size from lna_inv_sizing.py
    display: NGN
    typical: 78
  WP:
    description: LNA size from lna_inv_sizing.py
    display: WP
    unit: m
    typical: 0.000304044
  LPCH:
    description: LNA size from lna_inv_sizing.py
    display: LPCH
    unit: m
    typical: 1.3e-07
  NGP:
    description: LNA size from lna_inv_sizing.py
    display: NGP
    typical: 152
  RF:
    description: LNA size from lna_inv_sizing.py
    display: RF
    unit: ohm
    typical: 343.133
  CPAD:
    description: LNA size from lna_inv_sizing.py
    display: CPAD
    unit: F
    typical: 4.71e-13
  LSH:
    description: LNA size from lna_inv_sizing.py
    display: LSH
    unit: H
    typical: 3.71083e-09
  RLSH:
    description: LNA size from lna_inv_sizing.py
    display: RLSH
    unit: ohm
    typical: 1.13781
  CD:
    description: LNA size from lna_inv_sizing.py
    display: CD
    unit: F
    typical: 0
  CC:
    description: LNA size from lna_inv_sizing.py
    display: CC
    unit: F
    typical: 1e-11
  CBLK:
    description: LNA size from lna_inv_sizing.py
    display: CBLK
    unit: F
    typical: 1e-11
  # </sizes>

parameters:
  corners:
    spec:
      idd_ma:
        display: Supply current
        description: Current from the 1.2 V rail at the operating point
        unit: mA
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 5.0
      s11_db:
        display: S11 at 2.44 GHz
        description: Input reflection against 50 ohm, from the ac input impedance
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: -10
      gm_ms:
        display: Transconductance at 2.44 GHz
        description: Output current into 200 ohm per volt of available source voltage
        unit: mS
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      nf_db:
        display: Noise figure at 2.44 GHz
        description: From the input-referred noise against the 50 ohm source, bench load noiseless
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 2.5
    tool:
      ngspice:
        template: lna_inv_tb_cace.sch
        format: ascii
        suffix: .data
        variables: [idd_ma, s11_db, gm_ms, nf_db]   # echoed in A, dB, S, dB, scaled by unit for display
    plot:
      nf_db_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: nf_db
        limits: auto
      nf_db_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: nf_db
        limits: auto
      nf_db_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: nf_db
        limits: auto
      s11_db_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: s11_db
        limits: auto
      s11_db_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: s11_db
        limits: auto
      gm_ms_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: gm_ms
        limits: auto
      gm_ms_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: gm_ms
        limits: auto
      idd_ma_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: idd_ma
        limits: auto
    conditions:
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.32
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 125
