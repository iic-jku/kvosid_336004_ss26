#
#--------------------------------------------------------------
# CACE circuit characterization file
#
# Reference solution of the SS26 anti-aliasing filter (KV 336.004).
# The DUT is schematic/xschem/filter.sch: a fully differential 3rd-order MFB
# low-pass whose amplifier is the behavioural ota_fd_2pole macro. The macro
# parameters are CACE conditions, so the run can sweep the amplifier from
# ideal to what ~90 uW actually buys and show which specifications break.
#
# Component values come from python/filter_design_ss26.py.
#--------------------------------------------------------------

name:           filter
description:    SS26 anti-aliasing filter reference solution (MFB, 1 MHz, 20 dB)
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Michael Koefinger
  company:          Johannes Kepler University
  creation_date:    August 27, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vip:
    description: Positive filter input
    type: signal
    direction: input
  vin:
    description: Negative filter input
    type: signal
    direction: input
  vcm:
    description: Input and output common-mode reference
    type: signal
    direction: input
  vop:
    description: Positive filter output
    type: signal
    direction: output
  von:
    description: Negative filter output
    type: signal
    direction: output

default_conditions:
  # ---- environment -------------------------------------------------------------------
  vdd:
    description: Supply voltage. On the behavioural OTA it reaches the DUT only through
      vcm = vdd/2; it becomes a real condition once a transistor OTA replaces the macro.
    display: VDD
    unit: V
    minimum: 1.35
    typical: 1.5
    maximum: 1.65
  vcm:
    description: Common-mode level of input and output, tracks vdd/2
    display: Vcm
    unit: V
    minimum: 0.675
    typical: 0.75
    maximum: 0.825
  corner_mos:
    description: Process corner MOSFET. Inert while the DUT amplifier is the behavioural
      ota_fd_2pole macro; live as soon as a transistor OTA replaces it.
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    minimum: -40
    typical: 27
    maximum: 125
  rload:
    description: ADC input resistance, differential
    display: Rload
    unit: Ω
    typical: 560e3
  cload:
    description: ADC input capacitance, differential
    display: Cload
    unit: F
    typical: 5e-12

  # ---- system-level numbers used by the measurements ---------------------------------
  vfs:
    description: ADC full scale, differential
    display: Vfs
    unit: Vpp
    typical: 1.0
  nbits:
    description: ADC resolution
    display: n_bits
    typical: 8
  apass:
    description: Specified pass-band gain (linear)
    display: A_pass
    typical: 10
  fstop:
    description: Stop-band frequency, f_s - f_pass (stream decimated to 2*f_pass)
    display: f_stop
    unit: Hz
    typical: 9e6
  fnmin:
    description: Lower limit of the noise integration band
    display: f_n,min
    unit: Hz
    typical: 100
  fnmax:
    description: Upper limit of the noise integration band (= f_stop)
    display: f_n,max
    unit: Hz
    typical: 9e6

  # ---- distortion stimulus -----------------------------------------------------------
  fsig:
    description: Signal frequency of the distortion test
    display: f_sig
    unit: Hz
    typical: 1e6
  vamp:
    description: Single-ended input amplitude, gives Vfs at the output
    display: V_in
    unit: V
    typical: 0.05

  # ---- OTA macro model (ota_fd_2pole) ------------------------------------------------
  # Typical values model a 2-stage Miller OTA in ~90 uW at VDD = 1.5 V:
  # I_tot = 60 uA, gm/ID = 15, I_tail = 30 uA  ->  A0 = GM*RO = 60 dB,
  # f_ug = GM/(2*pi*CO) = 30 MHz. The specifications ask for 69 dB and 330 MHz,
  # so this amplifier is deliberately 9 dB and 11x short.
  gm:
    description: OTA transconductance
    display: GM
    unit: S
    typical: 25.1e-3
  ro:
    description: OTA output resistance (sets A0 = GM*RO)
    display: RO
    unit: Ω
    typical: 2e6
  co:
    description: OTA output capacitance (sets f_ug = GM/(2*pi*CO))
    display: CO
    unit: F
    typical: 12.1e-12
  rp:
    description: OTA input series resistance (with CP the non-dominant pole)
    display: RP
    unit: Ω
    # not 0: that degenerates to a 1 pOhm resistor and upsets the transient solver
    typical: 1
  cp:
    description: OTA input capacitance
    display: CP
    unit: F
    typical: 0.1e-12
  i0:
    description: OTA tail current, limits slew rate and large-signal linearity
    display: I0
    unit: A
    typical: 100e-6

parameters:

  # ==========================================================================
  # AC and noise: everything the transfer function and the noise budget decide
  # ==========================================================================
  ac_params:
    spec:
      a_pass_db:
        display: Pass-band gain
        description: Small-signal gain at 10 kHz
        unit: dB
        minimum:
          value: 19.5
        typical:
          value: 20.0
        maximum:
          value: 20.5
      f_pass:
        display: Cut-off frequency
        description: Upper -3 dB corner of the complete filter
        unit: Hz
        minimum:
          value: 0.9e6
        typical:
          value: 1.0e6
        maximum:
          value: 1.1e6
      att_db:
        display: Stop-band attenuation
        description: Attenuation at f_stop relative to the pass-band gain
        unit: dB
        minimum:
          value: 49.9
        typical:
          value: any
        maximum:
          value: any
      peak_db:
        display: Pass-band peaking
        description: Maximum gain in the pass band, relative to the dc gain
        unit: dB
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 3.0
      eps_g:
        display: Gain error
        description: Relative deviation of the dc gain from A_pass
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.00390625
      v_on:
        display: Output-referred noise
        description: Integrated output noise over the specified band
        unit: V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 113e-6
      snr_db:
        display: SNR (quantization + filter noise)
        description: Peak SNR of a full-scale sine, quantization and filter noise only
        unit: dB
        minimum:
          value: 48.6
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: filter_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [a_pass_db, f_pass, att_db, peak_db, eps_g, v_on, snr_db]
        script: filter_tb_ac.py
        script_variables: [a_pass_db_arr, f_pass_arr, att_db_arr, peak_db_arr,
                           eps_g_arr, v_on_arr, snr_db_arr]
    plot:
      a_pass_db_vs_gm:
        type: xyplot
        xaxis: gm
        yaxis: a_pass_db
        limits: auto
      f_pass_vs_gm:
        type: xyplot
        xaxis: gm
        yaxis: f_pass
        limits: auto
      eps_g_vs_gm:
        type: xyplot
        xaxis: gm
        yaxis: eps_g
        limits: auto
      v_on_vs_gm:
        type: xyplot
        xaxis: gm
        yaxis: v_on
        limits: auto
      v_on_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: v_on
        limits: auto
      a_pass_db_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: a_pass_db
        limits: auto
      f_pass_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: f_pass
        limits: auto
    conditions:
      # sweep the amplifier from what 90 uW buys towards ideal, so the
      # degradation shows up as a curve rather than a single verdict
      gm:
        enumerate: [1e-3, 5e-3, 25.1e-3, 100e-3, 1]
      ro:
        typical: 2e6
      co:
        typical: 12.1e-12
      i0:
        typical: 100e-6
      vdd:
        minimum: 1.35
        typical: 1.5
        maximum: 1.65
      vcm:
        minimum: 0.675
        typical: 0.75
        maximum: 0.825
      corner_mos:
        typical: tt
      corner_r:
        typical: typ
      temp:
        minimum: -40
        typical: 27
        maximum: 125
      rload:
        typical: 560e3
      cload:
        typical: 5e-12

  # ==========================================================================
  # Distortion: only meaningful with a finite tail current I0
  # ==========================================================================
  thd_params:
    spec:
      thd_db:
        display: Total harmonic distortion
        description: THD of a full-scale sine at f_sig
        unit: dBc
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: -60.0
    tool:
      ngspice:
        template: filter_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [thd_db]
    plot:
      thd_db_vs_fsig:
        type: xyplot
        xaxis: fsig
        yaxis: thd_db
        limits: auto
    conditions:
      fsig:
        # distortion is worst at the top of the pass band, where the loop gain has gone
        enumerate: [1e4, 1e5, 5e5, 1e6]
      vamp:
        typical: 0.05
      gm:
        typical: 25.1e-3
      i0:
        typical: 100e-6
      temp:
        typical: 27
